---
# Fresh-install scenario (single node) from the ci/README.md matrix:
# real playbooks against localhost, then assert cluster init, LB routing,
# metrics, and an encrypted snapshot. Multi-node topologies come later.
name: integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fresh-install-single-node:
    runs-on: ubuntu-latest
    env:
      OPENBAO_VERSION: "2.6.1"
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /etc/openbao/tls/ca.crt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible + helper packages
        run: |
          pip install ansible-core
          sudo apt-get update -q
          sudo apt-get install -y age jq libcap2-bin

      - name: Install OpenBao package (checksum-verified)
        run: |
          base="https://github.com/openbao/openbao/releases/download/v${OPENBAO_VERSION}"
          curl -sSLO "${base}/openbao_${OPENBAO_VERSION}_linux_amd64.deb"
          curl -sSLO "${base}/checksums.txt"
          grep " openbao_${OPENBAO_VERSION}_linux_amd64.deb$" checksums.txt | sha256sum -c -
          sudo dpkg -i "openbao_${OPENBAO_VERSION}_linux_amd64.deb"
          bao version

      - name: Generate age backup key (user-owned key simulation)
        run: |
          age-keygen -o age.key 2>age.pub.txt
          echo "AGE_RECIPIENT=$(grep -oE 'age1[a-z0-9]+' age.pub.txt)" >> "$GITHUB_ENV"

      - name: INFRA | deployment CA
        run: ansible-playbook -i ci/inventory-ci.yml infra.yml --tags ca

      - name: NODE | host tuning
        run: ansible-playbook -i ci/inventory-ci.yml node.yml --tags tune

      - name: BAO | full cluster module
        run: >-
          ansible-playbook -i ci/inventory-ci.yml bao.yml
          -e "bao_snapshot_age_recipient=${AGE_RECIPIENT}"

      - name: Unseal and wait for active (health 200)
        run: |
          key="$(jq -r '.unseal_keys_b64[0]' secrets/ci-init.json)"
          bao operator unseal "$key"
          code=000
          for _ in $(seq 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --cacert "$BAO_CACERT" "$BAO_ADDR/v1/sys/health" || echo 000)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health=$code"
          test "$code" = "200"

      - name: HAProxy routes to the active node
        run: |
          # HAProxy needs its health checks (inter 2s, rise 2) to pass after
          # unseal before the backend goes up; early curls fail at TLS level
          # (no backend behind the TCP frontend), so tolerate failures while
          # retrying.
          code=000
          for _ in $(seq 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --cacert "$BAO_CACERT" https://127.0.0.1:8443/v1/sys/health || echo 000)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "lb health=$code"
          test "$code" = "200"

      - name: Prometheus metrics exposed (token-less)
        run: |
          curl -s --cacert "$BAO_CACERT" "$BAO_ADDR/v1/sys/metrics?format=prometheus" \
            | grep -E '^vault_core_unsealed' | grep -q ' 1'

      - name: Encrypted snapshot via backup.yml
        run: |
          jq -r '.root_token' secrets/ci-init.json | sudo tee /etc/openbao/snapshot-token >/dev/null
          sudo chmod 600 /etc/openbao/snapshot-token
          ansible-playbook -i ci/inventory-ci.yml backup.yml
          sudo ls /var/backups/openbao/ | grep -E '\.snap\.age$'
          sudo test -s /var/backups/openbao/.last-success

      - name: Snapshot decrypts and is a valid raft snapshot (rehearsal seed)
        run: |
          # glob must expand inside a root shell -- the target dir is 0700
          artifact="$(sudo sh -c 'ls -1t /var/backups/openbao/*.snap.age' | head -1)"
          sudo cat "$artifact" | age -d -i age.key > restored.snap
          # raft snapshots are gzip archives; verify integrity
          file restored.snap | grep -q gzip
          gzip -t restored.snap

      - name: Show server log on failure
        if: failure()
        run: sudo journalctl -u openbao --no-pager | tail -100

  ha-cluster-3node:
    runs-on: ubuntu-latest
    env:
      OPENBAO_VERSION: "2.6.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible + docker connection plugin
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.docker
          sudo apt-get update -q
          sudo apt-get install -y jq

      - name: Download OpenBao package (checksum-verified)
        run: |
          base="https://github.com/openbao/openbao/releases/download/v${OPENBAO_VERSION}"
          curl -sSLO "${base}/openbao_${OPENBAO_VERSION}_linux_amd64.deb"
          curl -sSLO "${base}/checksums.txt"
          grep " openbao_${OPENBAO_VERSION}_linux_amd64.deb$" checksums.txt | sha256sum -c -
          # bao CLI on the runner drives unseal/assertions from outside
          sudo dpkg -i "openbao_${OPENBAO_VERSION}_linux_amd64.deb"

      - name: Start 3 systemd containers as cluster nodes
        run: |
          docker network create --subnet 10.10.0.0/24 baonet
          for i in 1 2 3; do
            docker run -d --name "bao-ci-$i" --privileged --cgroupns=host \
              --network baonet --ip "10.10.0.1$i" \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock \
              geerlingguy/docker-ubuntu2404-ansible:latest
          done
          for i in 1 2 3; do
            docker cp "openbao_${OPENBAO_VERSION}_linux_amd64.deb" "bao-ci-$i:/tmp/openbao.deb"
            docker exec "bao-ci-$i" bash -c \
              'apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y \
                 libcap2-bin cron openssl && dpkg -i /tmp/openbao.deb'
          done

      - name: INFRA | deployment CA (on node 1)
        run: ansible-playbook -i ci/inventory-ci3.yml infra.yml --tags ca

      - name: BAO | 3-node cluster module
        run: ansible-playbook -i ci/inventory-ci3.yml bao.yml

      - name: Unseal all nodes (standbys join via retry_join)
        run: |
          docker cp bao-ci-1:/etc/bao-stack/ca/ca.crt ci3-ca.crt
          key="$(jq -r '.unseal_keys_b64[0]' secrets/ci3-init.json)"
          for ip in 10.10.0.11 10.10.0.12 10.10.0.13; do
            ok=no
            for _ in $(seq 20); do
              if BAO_ADDR="https://$ip:8200" BAO_CACERT="$PWD/ci3-ca.crt" \
                   bao operator unseal "$key" >/dev/null 2>&1; then
                ok=yes; break
              fi
              sleep 3
            done
            echo "unseal $ip: $ok"
            test "$ok" = yes
          done

      - name: Exactly one active node, two standbys
        run: |
          active=0; standby=0
          for _ in $(seq 30); do
            active=0; standby=0
            for ip in 10.10.0.11 10.10.0.12 10.10.0.13; do
              c="$(curl -s -o /dev/null -w '%{http_code}' --cacert ci3-ca.crt "https://$ip:8200/v1/sys/health" || echo 000)"
              [ "$c" = "200" ] && active=$((active + 1))
              [ "$c" = "429" ] && standby=$((standby + 1))
            done
            [ "$active" = "1" ] && [ "$standby" = "2" ] && break
            sleep 2
          done
          echo "active=$active standby=$standby"
          test "$active" = "1" && test "$standby" = "2"

      - name: Raft has 3 voters (autopilot promotion)
        run: |
          root="$(jq -r '.root_token' secrets/ci3-init.json)"
          voters=0
          for _ in $(seq 60); do
            voters="$(docker exec -e BAO_ADDR=https://10.10.0.11:8200 \
              -e BAO_CACERT=/etc/openbao/tls/ca.crt -e "BAO_TOKEN=$root" \
              bao-ci-1 bao operator raft list-peers 2>/dev/null \
              | grep -c 'true' || true)"
            [ "$voters" = "3" ] && break
            sleep 3
          done
          echo "voters=$voters"
          test "$voters" = "3"

      - name: HAProxy routes to the active node
        run: |
          code=000
          for _ in $(seq 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --cacert ci3-ca.crt https://10.10.0.11:8443/v1/sys/health || echo 000)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "lb health=$code"
          test "$code" = "200"

      - name: Failure injection -- stop the leader, expect re-election
        run: |
          # find and stop the current active node
          leader=""
          for i in 1 2 3; do
            c="$(curl -s -o /dev/null -w '%{http_code}' --cacert ci3-ca.crt "https://10.10.0.1$i:8200/v1/sys/health" || echo 000)"
            [ "$c" = "200" ] && leader="$i"
          done
          echo "stopping leader bao-ci-$leader"
          test -n "$leader"
          docker stop "bao-ci-$leader"
          # a survivor must become active (already unsealed; quorum 2/3)
          new=""
          for _ in $(seq 45); do
            for i in 1 2 3; do
              [ "$i" = "$leader" ] && continue
              c="$(curl -s -o /dev/null -w '%{http_code}' --cacert ci3-ca.crt "https://10.10.0.1$i:8200/v1/sys/health" || echo 000)"
              [ "$c" = "200" ] && new="$i" && break 2
            done
            sleep 2
          done
          echo "new leader: bao-ci-${new:-NONE}"
          test -n "$new"
          # the surviving node's HAProxy re-routes to the new active
          code=000
          for _ in $(seq 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --cacert ci3-ca.crt "https://10.10.0.1$new:8443/v1/sys/health" || echo 000)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "lb-after-failover health=$code"
          test "$code" = "200"

      - name: Show cluster logs on failure
        if: failure()
        run: |
          docker ps -a
          for i in 1 2 3; do
            echo "=== bao-ci-$i ==="
            docker exec "bao-ci-$i" journalctl -u openbao --no-pager 2>/dev/null | tail -40 || true
          done
